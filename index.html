<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebäudekatalog - Historische Forstgebäude MV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50 min-h-screen">
    <!-- Header -->
    <header class="bg-[#154734] text-white">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 bg-[#91ae2d] rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 22V8h18v14H3zM21 6H3V4h18v2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">Gebäudekatalog</h1>
                    <p class="text-[#91ae2d]">Historische Forstgebäude Mecklenburg-Vorpommern</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Section -->
    <section class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="Gebäude suchen..."
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#3e822c] focus:border-transparent">
                </div>
                <div class="flex gap-3">
                    <select id="conditionFilter" class="px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#3e822c] focus:border-transparent">
                        <option value="">Alle Bauzustände</option>
                        <option value="Denkmalfachlich gelungene (Um)Nutzung">Denkmalfachlich gelungene (Um)Nutzung</option>
                        <option value="Erfolgreiche und solide Sicherung">Erfolgreiche und solide Sicherung</option>
                        <option value="Denkmalverträgliche Teilnutzung">Denkmalverträgliche Teilnutzung</option>
                        <option value="Gefahr für den Bestand">Gefahr für den Bestand</option>
                    </select>
                    <select id="cityFilter" class="px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#3e822c] focus:border-transparent">
                        <option value="">Alle Orte</option>
                    </select>
                </div>
            </div>
            <div class="mt-3 text-sm text-gray-600">
                <span id="resultCount">0 Gebäude gefunden</span>
            </div>
        </div>
    </section>

    <!-- Buildings Grid -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div id="buildingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Buildings will be loaded here -->
        </div>

        <!-- Load More Button -->
        <div class="text-center mt-12">
            <button id="loadMoreBtn" class="bg-[#3e822c] hover:bg-[#154734] text-white px-8 py-3 rounded-lg font-medium transition-colors hidden">
                Mehr laden
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#154734] text-white mt-16">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="text-center text-sm text-gray-300">
                <p>© 2024 Landesforstanstalt Mecklenburg-Vorpommern</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
